name: Measurement report
description: Report a dimension you measured on a real box.
labels: ["measurement"]
body:
  - type: markdown
    attributes:
      value: Please do not attach TAKACHI drawings or catalog pages.
  - type: input
    id: model
    attributes:
      label: Model number
      placeholder: BCAP091207G
    validations:
      required: true
  - type: textarea
    id: feature
    attributes:
      label: What you measured
    validations:
      required: true
  - type: input
    id: measured
    attributes:
      label: Measured value (mm or degrees)
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: How you measured (tool, photos)
